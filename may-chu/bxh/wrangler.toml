# Máy chủ bảng xếp hạng chung của Tiệm Trà Nhỏ (bản 5.7). Đưa lên: xem README.md cùng thư mục.
name = "tiemtra-bxh"
main = "worker.js"
compatibility_date = "2026-09-01"
