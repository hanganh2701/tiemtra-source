<!doctype html>
<!-- ảnh chia sẻ og.png (1200×630) của didate. Chụp lại: node may-chu/didate/hinh/chup.mjs -->
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: "Baloo 2"; font-weight: 800; src: url(../public/fonts/baloo2-800.woff) format("woff"); }
      @font-face { font-family: "Baloo 2"; font-weight: 600; src: url(../public/fonts/baloo2-600.woff) format("woff"); }
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body { display: flex; align-items: center; gap: 56px; padding: 0 80px; box-sizing: border-box; background: linear-gradient(160deg, #ffe3ee, #fff7fa 70%); color: #3d2230; font-family: "Baloo 2", sans-serif; }
      .chu { flex: 1; }
      .logo { display: flex; align-items: center; gap: 14px; font-size: 44px; font-weight: 800; }
      .logo img { width: 64px; height: 64px; }
      h1 { margin: 18px 0 14px; font-size: 68px; line-height: 1.08; font-weight: 800; }
      p { margin: 0; font-size: 30px; font-weight: 600; color: #6e4a5c; }
      .nut { display: inline-block; margin-top: 26px; padding: 12px 30px; border-radius: 999px; background: #c2255c; color: #fff; font-size: 30px; font-weight: 800; }
      .hinh { position: relative; width: 330px; padding: 16px 16px 60px; background: #fff; transform: rotate(4deg); box-shadow: 0 30px 60px -24px rgba(194, 37, 92, 0.6); }
      .hinh img { display: block; width: 100%; }
      .khong { position: absolute; right: -54px; bottom: 70px; padding: 10px 22px; border: 3px solid #f2c3d5; border-radius: 999px; background: #fff; color: #9c1c4a; font-size: 26px; font-weight: 800; transform: rotate(10deg); }
      .thu { position: absolute; top: -40px; left: -36px; font-size: 76px; transform: rotate(-14deg); }
    </style>
  </head>
  <body>
    <div class="chu">
      <div class="logo"><img src="../public/icon.svg" alt="" />didate</div>
      <h1>Thiệp mời dễ thương, gửi bằng một đường link 💌</h1>
      <p>Rủ đi ăn · Tỏ tình · Xin lỗi · Chúc sinh nhật</p>
      <span class="nut">Cóoo 💖</span>
    </div>
    <div class="hinh"><span class="thu">💌</span><img src="../public/anh-mau.svg" alt="" /><span class="khong">Để em nghĩ đã 🙈</span></div>
  </body>
</html>
